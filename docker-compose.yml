version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ordermenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ordermenu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - ordermenu-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordermenu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI để xem & quản lý trực quan database qua trình duyệt (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: ordermenu-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ordermenu-net

volumes:
  pgdata:
    driver: local

networks:
  ordermenu-net:
    driver: bridge
